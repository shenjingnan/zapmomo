[package]
name = "zapmomo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 可执行文件名与包名解耦：产出 ZapMomo 而非 zapmomo-app，
# `tauri dev` 裸跑二进制时 Cmd+Tab / 活动监视器显示 ZapMomo。
# 包名 zapmomo-app 保留，CI / release-plz 的 -p 引用不受影响。
[[bin]]
name = "ZapMomo"
path = "src/main.rs"

[dependencies]
# Tauri 桌面框架（protocol-asset 用于通过 asset:// 协议把本地模型文件喂给 WebView；
# tray-icon 用于常驻托盘图标；macos-private-api 用于 macOS 透明窗口）
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api", "image-png"] }

# 文件/目录选择对话框（用户加载 Live2D 模型目录）
tauri-plugin-dialog = "2"

# 系统级全局快捷键（Rust 侧注册与分发；设置页经自定义 command 间接操作）
tauri-plugin-global-shortcut = "2"

# 开机自启动（LaunchAgent / Run 键 / XDG .desktop，Rust 侧经自定义 command 操作；
# 系统注册即唯一真值，不在 settings.toml 落盘）
tauri-plugin-autostart = "2"

# 单实例防护：自启常驻后手动再点图标激活已有实例，而非拉起第二个桌宠
tauri-plugin-single-instance = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志（复用根 crate 的 init_logging 初始化双层 tracing）
tracing = "0.1"

# 复用根 crate 的 KWS / 音频 / 配置逻辑
zapmomo = { path = ".." }

[target."cfg(target_os = \"macos\")".dependencies]
# 把角色窗口转成 macOS 非激活面板（non-activating panel）：拖动/点击不抢前台焦点
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(windows)'.dependencies]
# 置底：SetWindowPos(HWND_BOTTOM) 把角色窗口沉到 Z 序底部
#（windows crate 已是 tauri 的传递依赖，此处显式声明为直接依赖并启用所需 feature）
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
