[workspace]
# release-plz 负责版本号 / git tag / changelog / crates.io 发布。
# GitHub Release 与桌面安装包由 .github/workflows/release.yml（Tauri）接管。
git_release_enable = false
git_tag_enable = false

[[package]]
name = "zapmomo"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"

[[package]]
name = "zapmomo-app"
# 桌面应用 crate：不发布 crates.io，但 src-tauri/ 改动必须能触发发布 PR。
# release-pr 只分析两类包：可发布包（对 registry）与 git_only 包（对 git tag）；
# 仅 publish = false + release = true 不足以让 src-tauri 改动被统计
# （PR #269 纯 src-tauri 改动未出 release PR 实证），必须 git_only = true，
# 以专属 tag zapmomo-app-vX.Y.Z 为版本基线。该 tag 与根包 v* tag 打在同一
# release merge commit 上；前缀非 v 开头，不会误触发监听 v* 的 release.yml。
# 副作用：版本与 zapmomo lib 共享（version.workspace），app 的 bump 会带动
# workspace 版本，lib 随之一同 bump/发布。
# publish = false 需与 src-tauri/Cargo.toml 的 publish = false 保持一致，否则 release-plz 报错
publish = false
release = true
git_only = true
git_tag_enable = true
git_tag_name = "zapmomo-app-v{{ version }}"
