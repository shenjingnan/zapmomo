name: Release

# 每次 release-plz 创建 vX.Y.Z tag（推送）后，在原生 runner 上构建
# Windows / macOS（双架构）/ Linux 的安装包，合并到一个 GitHub Release。
# 构建成功后自动发布为正式 Release。
#
# 发布走 PAT_TOKEN Secret（与 publish.yml 的 release-plz 共用同一 PAT，具备
# Contents 读写权限）而非默认 GITHUB_TOKEN：GITHUB_TOKEN 产生的事件不触发其他
# workflow（GitHub 防递归机制），upload-baidu-pan.yml 依赖 release: published
# 事件自动上传百度网盘，用 GITHUB_TOKEN 发布会让它永远静默不触发（无失败记录）。
# PAT 过期/失效时下方 Check release token 步骤会提前报错。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            audiocpp_triple: aarch64-apple-darwin
            # arm64 保留 Metal（大模型可走 GPU；小模型实测 CPU 更快，运行时按 [tts].provider 选择）
            audiocpp_extra: '-DENGINE_ENABLE_METAL=ON'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            audiocpp_triple: x86_64-apple-darwin
            # ARM runner 上交叉编译 x86_64：Metal 关闭（Intel Mac 走 CPU）
            audiocpp_extra: '-DENGINE_ENABLE_METAL=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64'
          - platform: ubuntu-22.04
            args: ''
            audiocpp_triple: x86_64-unknown-linux-gnu
            audiocpp_extra: ''
          - platform: windows-latest
            args: ''
            audiocpp_triple: x86_64-pc-windows-msvc
            audiocpp_extra: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync tauri version to tag
        # tauri 打包版本取自 tauri.conf.json，需与 release-plz 打出的 vX.Y.Z tag 对齐。
        # 用 node（各平台 runner 均预装）更新 JSON：Windows 默认 shell 是 PowerShell（bash 语法会报错），
        # 且 windows runner 未预装 jq。
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node - <<'EOF'
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = process.env.VERSION;
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          EOF

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      - name: Setup pnpm
        # 版本由根 package.json 的 packageManager 字段决定（pnpm@10.18.2）
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 版本单一来源 .node-version（本地 fnm 与 CI 读同一文件）
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend deps
        # 安装除 docs（Next.js）外的所有 workspace：根包（@tauri-apps/cli）+ frontend（React）
        # 注意：--filter 按包名匹配，docs workspace 的包名为 zapmomo-docs
        run: pnpm install --filter '!zapmomo-docs' --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        # 安装 macOS 交叉编译 target（aarch64 + x86_64）。
        # dtolnay 装的工具链（1.97.1）与 rust-toolchain.toml 一致；
        # rustup target add 运行于项目目录，遵循 override 装到激活的工具链上。
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build artifacts
        # 缓存 ~/.cargo + target/。macOS 双 target 矩阵用 args 区分缓存线，
        # 避免两个矩阵条目写同一 key 互相覆盖导致另一半永远冷缓存。
        # 注意：rust-cache 保存前会清空 target/ 下非 cargo 构建目录里的文件，
        # sherpa-onnx 预编译库会被清成空目录，因此需单独缓存并校验（下一步）。
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ matrix.args }}

      - name: Cache sherpa-onnx prebuilt libs
        # 同 ci.yml check job：rust-cache 恢复出的 sherpa-onnx-prebuilt 可能只剩
        # 空目录，而 build.rs 只判断目录存在就跳过下载，链接时才报缺库。
        # macOS 双 target 各自的解压目录名含 arch，共用一个 key 不会互相错配。
        uses: actions/cache@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Rehydrate sherpa-onnx prebuilt libs
        shell: bash
        run: |
          if [ -d target/sherpa-onnx-prebuilt ] \
            && [ -z "$(find target/sherpa-onnx-prebuilt -type f -print -quit)" ]; then
            echo '::warning::target/sherpa-onnx-prebuilt restored empty (rust-cache strips lib files), purging to force re-download'
            rm -rf target/sherpa-onnx-prebuilt
          fi

      - name: Build audiocpp_server sidecar
        # TTS 第二后端（audio.cpp，Apache-2.0）的 sidecar 进程：裁剪构建只编
        # pocket_tts + omnivoice 模型族（实测约 12MB / ~2.5 分钟）。DEPLOYMENT_BUILD 把 model specs 编进二进制
        # （否则运行时依赖源码目录的 model_specs/）；NATIVE_CPU=OFF 保证产物可移植
        # （默认 -march=native 只能在构建机级 CPU 上跑）。externalBin 要求带 target
        # triple 后缀的文件名（tauri.conf.json bundle.externalBin）。
        # 引擎版本升级只改 AUDIOCPP_REF（与 tauri.conf.json 同步审查）。
        # 注意：上游 tag 命名是 release-X.Y.Z（无 v 前缀，v* 只有远古 windows-prebuilt）。
        shell: bash
        env:
          AUDIOCPP_REF: release-0.6.1
          AUDIOCPP_TRIPLE: ${{ matrix.audiocpp_triple }}
          AUDIOCPP_EXTRA: ${{ matrix.audiocpp_extra }}
        run: |
          git clone --depth 1 --branch "$AUDIOCPP_REF" https://github.com/0xShug0/audio.cpp .audiocpp-src
          # macOS：Apple Clang 不带 OpenMP。native（arm64）job 装 brew libomp 并以
          # OpenMP_ROOT 定位（keg-only）；x86_64 交叉编译 job 无 x86_64 版 libomp
          # 可用，关 OpenMP（与该 job METAL=OFF 同等的可移植性取舍）。
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [[ "$AUDIOCPP_EXTRA" == *CMAKE_OSX_ARCHITECTURES* ]]; then
              export AUDIOCPP_EXTRA="$AUDIOCPP_EXTRA -DENGINE_ENABLE_OPENMP=OFF"
            else
              brew install libomp
              export OpenMP_ROOT="$(brew --prefix libomp)"
            fi
          fi
          COMMON_FLAGS="-DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=pocket_tts,omnivoice,voxcpm2,qwen3_tts \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_HIP=OFF"
          # shellcheck disable=SC2086
          cmake -S .audiocpp-src -B .audiocpp-build $COMMON_FLAGS $AUDIOCPP_EXTRA -DCMAKE_BUILD_TYPE=Release
          JOBS="${NUMBER_OF_PROCESSORS:-$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)}"
          cmake --build .audiocpp-build --target audiocpp_server --config Release --parallel "$JOBS"
          # MSVC multi-config 产物在 bin/Release/ 子目录，find 兜底两种布局
          SRC_BIN=$(find .audiocpp-build -type f -name 'audiocpp_server*' ! -name '*.dSYM*' | head -1)
          test -n "$SRC_BIN" || { echo '::error::audiocpp_server 产物未找到'; exit 1; }
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then EXE_SUFFIX=".exe"; else EXE_SUFFIX=""; fi
          cp "$SRC_BIN" "src-tauri/binaries/audiocpp_server-${AUDIOCPP_TRIPLE}${EXE_SUFFIX}"
          ls -lh src-tauri/binaries/

      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配置证书后由 tauri-action 自动签名/公证 macOS 产物
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true

      - name: Rename installers to user-friendly asset names
        # Tauri 产物默认名对普通用户不友好：平台术语混杂
        # （x64-setup / aarch64 / amd64 / x86_64）；
        # Windows 双安装包、macOS 双架构无选择指引。统一重命名为
        # <产品>_<平台>_<架构>.<后缀>，Release 资产列表按平台自动分组排序。
        # 刻意不注入版本号：资产名跨版本保持不变，README 的
        # releases/latest/download/<文件名> 直链因此永远指向最新版，
        # 用户无需访问 Release 页即可一键下载。代价是下载到本地的文件名不含
        # 版本号（0.1.x 阶段可接受）；未来启用 Tauri updater 时需恢复版本化资产。
        # 未启用 updater（无 .sig 签名文件），重命名不影响任何校验。
        # 注意：aarch64.dmg 分支必须在 x64.dmg 之前（前者同样匹配 *x64.dmg）。
        shell: bash
        run: |
          shopt -s nullglob
          for f in *; do
            case "$f" in
              *x64-setup.exe)  mv "$f" "ZapMomo_Windows_x64.exe" ;;
              *_en-US.msi)     mv "$f" "ZapMomo_Windows_x64.msi" ;;
              *aarch64.dmg)    mv "$f" "ZapMomo_macOS_arm64.dmg" ;;
              *x64.dmg)        mv "$f" "ZapMomo_macOS_x64.dmg" ;;
              *amd64.deb)      mv "$f" "ZapMomo_Linux_amd64.deb" ;;
              *x86_64.rpm)     mv "$f" "ZapMomo_Linux_x86_64.rpm" ;;
              *amd64.AppImage) mv "$f" "ZapMomo_Linux_amd64.AppImage" ;;
            esac
          done
          ls -1

      - name: Generate release body (download guide)
        # 生成带「平台选择表格 + 下载按钮」的正文。资产名不含版本号（见上方
        # rename step），故链接用 <tag>/<固定文件名> 指向本次发布的具体资产。
        # generate_release_notes 的自动变更日志会追加在 body 之后（表格在上、changelog 在下）。
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > release_body.md <<EOF
          ## 📦 下载

          | 系统 | 芯片 / 架构 | 下载 | 说明 |
          | --- | --- | --- | --- |
          | **Windows 10 / 11** | x64 | [![Windows](https://img.shields.io/badge/download-Setup.exe-0078D6?logo=windows)](${BASE}/ZapMomo_Windows_x64.exe) | 双击安装；企业批量部署可选 [MSI 版](${BASE}/ZapMomo_Windows_x64.msi) |
          | **macOS 13+** | Apple Silicon（M1/M2/M3/M4） | [![macOS](https://img.shields.io/badge/download-arm64.dmg-8E8E93?logo=apple)](${BASE}/ZapMomo_macOS_arm64.dmg) | 不确定芯片？见下方说明 |
          | **macOS 13+** | Intel | [![macOS](https://img.shields.io/badge/download-x64.dmg-8E8E93?logo=apple)](${BASE}/ZapMomo_macOS_x64.dmg) | — |
          | **Ubuntu / Debian** | amd64 | [![deb](https://img.shields.io/badge/download-amd64.deb-A80030?logo=debian&logoColor=white)](${BASE}/ZapMomo_Linux_amd64.deb) | 或 [AppImage](${BASE}/ZapMomo_Linux_amd64.AppImage) 免安装运行 |
          | **Fedora / RHEL** | x86_64 | [![rpm](https://img.shields.io/badge/download-x86_64.rpm-294172?logo=fedora&logoColor=white)](${BASE}/ZapMomo_Linux_x86_64.rpm) | 或 [AppImage](${BASE}/ZapMomo_Linux_amd64.AppImage) 免安装运行 |

          > 🍎 Mac 用户不确定选哪个？点按左上角  菜单 →「关于本机」：显示「芯片：Apple M…」下载 **arm64** 版；显示「处理器：Intel Core…」下载 **x64** 版。
          EOF
          cat release_body.md

      - name: Check release token
        # 发布前确认 PAT_TOKEN 可用，缺失/过期时在这里报清晰错误，避免发布 job
        # 跑到最后一步才失败（见文件头注释，为何不能用 GITHUB_TOKEN）。该 Secret
        # 与 publish.yml 的 release-plz 共用，正常不会缺失；报错多半意味着 PAT
        # 已过期——需换新后同步更新 Secret，否则 release-plz 同样会失败。
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::缺少 PAT_TOKEN Secret（publish.yml 的 release-plz 也在使用，正常不应缺失，请检查是否被误删）。"
            exit 1
          fi

      - name: Attach installers to draft release
        uses: softprops/action-gh-release@v3
        with:
          # 显式传 PAT：用 GITHUB_TOKEN 发布的 release 事件不会触发
          # upload-baidu-pan.yml（GitHub 防递归机制，事件被静默丢弃）
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_body.md
          generate_release_notes: true
          files: |
            *.dmg
            *.app.tar.gz
            *.deb
            *.rpm
            *.AppImage
            *.msi
            *.exe
