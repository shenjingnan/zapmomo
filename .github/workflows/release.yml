name: Release

# 每次 release-plz 创建 vX.Y.Z tag（推送）后，在原生 runner 上构建
# Windows / macOS（双架构）/ Linux 的安装包，合并到一个 GitHub Release。
# 构建成功后自动发布为正式 Release。
#
# 发布走 PAT_TOKEN Secret（与 publish.yml 的 release-plz 共用同一 PAT，具备
# Contents 读写权限）而非默认 GITHUB_TOKEN：GITHUB_TOKEN 产生的事件不触发其他
# workflow（GitHub 防递归机制），upload-baidu-pan.yml 依赖 release: published
# 事件自动上传百度网盘，用 GITHUB_TOKEN 发布会让它永远静默不触发（无失败记录）。
# PAT 过期/失效时下方 Check release token 步骤会提前报错。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # audio.cpp 引擎版本（上游 tag 无 v 前缀）。下方 sidecar 构建步骤的 clone
  # 与 audiocpp 构建树缓存 key 都引用这里：升级引擎只改这一行（与
  # tauri.conf.json 同步审查）。
  AUDIOCPP_REF: release-0.6.1

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            runner: macos-latest
            # triple 供下方 Stage macOS bundles 步骤定位 bundle 产物目录
            # （target/<triple>/release/bundle），不挪用语义专属的 audiocpp_triple
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            audiocpp_triple: aarch64-apple-darwin
            # arm64 保留 Metal（大模型可走 GPU；小模型实测 CPU 更快，运行时按 [tts].provider 选择）
            audiocpp_extra: '-DENGINE_ENABLE_METAL=ON -DENGINE_ENABLE_CUDA=OFF'
          - platform: macos-latest
            runner: macos-latest
            triple: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            audiocpp_triple: x86_64-apple-darwin
            # ARM runner 上交叉编译 x86_64：Metal 关闭（Intel Mac 走 CPU）
            audiocpp_extra: '-DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_CUDA=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64'
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            args: ''
            audiocpp_triple: x86_64-unknown-linux-gnu
            audiocpp_extra: '-DENGINE_ENABLE_CUDA=OFF'
          - platform: windows-latest
            # runner 固定 windows-2022（VS 2022 / MSVC 19.4x）：windows-latest
            # 与 windows-2025 现均指向 VS 2026 镜像，CUDA 12.4 的 cudafe++ 前端
            # 解析 MSVC 19.51 头文件时直接段错误（run #33 实测 0xC0000005），
            # 无 flag 可救；上游 audio.cpp 的 Windows CI 同样用 windows-2022。
            # 19.44 若超 host_config 的 1943 上限，由下方 patch + -allow-
            # unsupported-compiler 双保险覆盖（对 19.4x 稳定）。
            runner: windows-2022
            args: ''
            audiocpp_triple: x86_64-pc-windows-msvc
            # Windows 开 CUDA（上游 VoxCPM2 CUDA 实测 RTF 0.23~0.55）；CUDA 运行时
            # DLL 由下方 Collect CUDA runtime DLLs 收集进 src-tauri/resources/cuda/，
            # 经 tauri.windows.conf.json 的 resources 随安装包分发
            audiocpp_extra: '-DENGINE_ENABLE_CUDA=ON'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync tauri version to tag
        # tauri 打包版本取自 tauri.conf.json，需与 release-plz 打出的 vX.Y.Z tag 对齐。
        # 用 node（各平台 runner 均预装）更新 JSON：Windows 默认 shell 是 PowerShell（bash 语法会报错），
        # 且 windows runner 未预装 jq。
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node - <<'EOF'
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = process.env.VERSION;
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          EOF

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      - name: Setup pnpm
        # 版本由根 package.json 的 packageManager 字段决定（pnpm@10.18.2）
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 版本单一来源 .node-version（本地 fnm 与 CI 读同一文件）
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend deps
        # 安装除 docs（Next.js）外的所有 workspace：根包（@tauri-apps/cli）+ frontend（React）
        # 注意：--filter 按包名匹配，docs workspace 的包名为 zapmomo-docs
        run: pnpm install --filter '!zapmomo-docs' --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        # 安装 macOS 交叉编译 target（aarch64 + x86_64）。
        # dtolnay 装的工具链（1.97.1）与 rust-toolchain.toml 一致；
        # rustup target add 运行于项目目录，遵循 override 装到激活的工具链上。
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build artifacts
        # 缓存 ~/.cargo + target/。macOS 双 target 矩阵用 args 区分缓存线，
        # 避免两个矩阵条目写同一 key 互相覆盖导致另一半永远冷缓存。
        # 注意：rust-cache 保存前会清空 target/ 下非 cargo 构建目录里的文件，
        # sherpa-onnx 预编译库会被清成空目录，因此需单独缓存并校验（下一步）。
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ matrix.args }}
          # Windows CUDA 冷构建约 1 小时，失败时也保存缓存，重试无需全量重编
          cache-on-failure: true

      - name: Cache sherpa-onnx prebuilt libs
        # 同 ci.yml check job：rust-cache 恢复出的 sherpa-onnx-prebuilt 可能只剩
        # 空目录，而 build.rs 只判断目录存在就跳过下载，链接时才报缺库。
        # macOS 双 target 各自的解压目录名含 arch，共用一个 key 不会互相错配。
        uses: actions/cache@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Rehydrate sherpa-onnx prebuilt libs
        shell: bash
        run: |
          if [ -d target/sherpa-onnx-prebuilt ] \
            && [ -z "$(find target/sherpa-onnx-prebuilt -type f -print -quit)" ]; then
            echo '::warning::target/sherpa-onnx-prebuilt restored empty (rust-cache strips lib files), purging to force re-download'
            rm -rf target/sherpa-onnx-prebuilt
          fi

      - name: Cache audiocpp build tree
        # Windows CUDA 冷编译实测 ~55 分钟，远超本 job 其余步骤总和。缓存
        # 源码树 + 构建目录后，脚本级失败（DLL 收集/冒烟）重跑时 ninja 无事
        # 可做，迭代从 ~1h 压到 ~5min。key 绑定引擎 ref（workflow 级 env）：
        # 升级引擎自动 miss 重建；改 CMake flags（COMMON_FLAGS/audiocpp_extra/
        # CUDA 架构列表）须手动 bump key 里的 v1 前缀，否则会命中旧 flags 的
        # 产物。job 失败时 post 步骤仍保存缓存（仅取消不保存），失败迭代同样
        # 为下次铺路。
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: |
            .audiocpp-src
            .audiocpp-build
          key: audiocpp-v1-${{ runner.os }}-${{ matrix.audiocpp_triple }}-${{ env.AUDIOCPP_REF }}

      - name: Install CUDA Toolkit
        # Windows 引擎开 CUDA（见 matrix audiocpp_extra）。选 12.4 轨：minor
        # version compatibility 下 12.x 运行时可跑在 R527+ 的 12.x 驱动上，
        # 覆盖面比 13.x（需 R580+）广。action 自动设置 CUDA_PATH。
        if: matrix.platform == 'windows-latest'
        # 上游已删除滚动 major tag v2（仓库现只维护 v0.2.x），@v2 无法解析会让
        # 整个 workflow 所有 job 在 Set up job 阶段失败（action 解析先于 if 求值）。
        # 因此固定到具体小版本而非 @master。
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          # v0.2.x 后期版本把输入名从 cuda-toolkit 改成了 cuda；用旧名会被静默
          # 忽略、回落到默认 13.2.0，装错 Toolkit 版本
          cuda: '12.4.0'

      - name: Setup MSVC environment
        # 仅 Windows：初始化 MSVC（cl/mt/rc 进 PATH，经 GITHUB_ENV 对后续步骤
        # 生效）。下方 CMake 用 Ninja 生成器时要求这些工具已在环境里（为何用
        # Ninja 见构建步骤注释）。
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build audiocpp_server sidecar
        # TTS/ASR 第二后端（audio.cpp，Apache-2.0）的 sidecar 进程：裁剪构建只编
        # omnivoice + voxcpm2 + qwen3_tts + qwen3_asr 模型族（实测约 12MB / ~2.5 分钟）。DEPLOYMENT_BUILD 把 model specs 编进二进制
        # （否则运行时依赖源码目录的 model_specs/）；NATIVE_CPU=OFF 保证产物可移植
        # （默认 -march=native 只能在构建机级 CPU 上跑）。externalBin 要求带 target
        # triple 后缀的文件名（tauri.conf.json bundle.externalBin）。
        # 引擎版本升级只改 AUDIOCPP_REF（与 tauri.conf.json 同步审查）。
        # 注意：上游 tag 命名是 release-X.Y.Z（无 v 前缀，v* 只有远古 windows-prebuilt）。
        shell: bash
        env:
          AUDIOCPP_TRIPLE: ${{ matrix.audiocpp_triple }}
          AUDIOCPP_EXTRA: ${{ matrix.audiocpp_extra }}
        run: |
          # AUDIOCPP_REF 来自 workflow 级 env（缓存 key 与这里同源）。
          # 构建树缓存命中时源码树已存在，跳过 clone。
          if [ ! -d .audiocpp-src/.git ]; then
            git clone --depth 1 --branch "$AUDIOCPP_REF" https://github.com/0xShug0/audio.cpp .audiocpp-src
          fi
          # macOS：Apple Clang 不带 OpenMP。native（arm64）job 装 brew libomp 并以
          # OpenMP_ROOT 定位（keg-only）；x86_64 交叉编译 job 无 x86_64 版 libomp
          # 可用，关 OpenMP（与该 job METAL=OFF 同等的可移植性取舍）。
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [[ "$AUDIOCPP_EXTRA" == *CMAKE_OSX_ARCHITECTURES* ]]; then
              export AUDIOCPP_EXTRA="$AUDIOCPP_EXTRA -DENGINE_ENABLE_OPENMP=OFF"
            else
              brew install libomp
              export OpenMP_ROOT="$(brew --prefix libomp)"
            fi
          fi
          # 各 entry 的 audiocpp_extra 显式带 ENGINE_ENABLE_CUDA（Windows=ON 开
          # CUDA 后端，其余 OFF）；VULKAN/HIP 两后端全平台关闭。
          COMMON_FLAGS="-DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=omnivoice,voxcpm2,qwen3_tts,qwen3_asr \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_HIP=OFF"
          # Windows 用 Ninja 生成器（上游 build_windows.ps1 同款）：VS 生成器的
          # CUDA 支持依赖装进 MSBuild 目录的 BuildCustomizations，而 CUDA 12.4
          # （2024 年）不认识 2026 镜像的 Visual Studio 18，enable_language(CUDA)
          # 直接报 No CUDA toolset found；Ninja 下 CMake 直接调 nvcc，不依赖
          # VS 集成，不受镜像升 VS 影响。单配置产物落 bin/，非 bin/Release/。
          # utf-8 与上游一致（源码含非 ASCII 字面量，MSVC 默认按本地代码页解析）。
          # 注意必须写 -utf-8 而非 /utf-8：本步骤是 Git Bash，MSYS 路径转换会把
          # 以 / 开头的 flag 当 Unix 路径改写成 C:/Program Files/Git/utf-8 传给
          # cl，报 C1083 找不到源文件（MSVC 选项同时接受 - 前缀，语义相同）。
          # 参数用数组而非字符串变量：CUDA 架构列表含分号、CUDA flags 含空格，
          # 字符串展开要么被 bash 拆散要么无法携带引号；数组元素天然完整。
          WIN_ARGS=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            WIN_ARGS+=(-G Ninja -DCMAKE_C_FLAGS=-utf-8 -DCMAKE_CXX_FLAGS=-utf-8 -DCMAKE_CUDA_HOST_COMPILER=cl)
            # CUDA 架构照抄上游策略：按 nvcc 实际支持过滤（virtual=仅 PTX，
            # 运行时 JIT 到本机卡；real=SASS 直出）。120/121（Blackwell）需
            # CUDA 12.8+，12.4 的 nvcc 不列 compute_120/121 会自动剔除。
            supported="$(nvcc --list-gpu-arch 2>/dev/null || true)"
            archs=""
            for pair in 75:75-virtual 80:80-virtual 86:86-real 89:89-real 120:120a-real 121:121a-real; do
              case "$supported" in *"compute_${pair%%:*}"*)
                archs="${archs:+$archs;}${pair#*:}" ;;
              esac
            done
            if [ -n "$archs" ]; then
              WIN_ARGS+=("-DCMAKE_CUDA_ARCHITECTURES=$archs")
              echo "CUDA architectures: $archs"
            fi
            # CUDA 12.4 的 crt/host_config.h 硬编码只放行 MSVC 2017~2022
            # （_MSC_VER ≤ 1943），2026 镜像的 19.51 触发 #error。-allow-
            # unsupported-compiler 是官方逃生口（PyTorch/llama.cpp 同款），
            # 但实测（run #29~#31）它够不着 CMake 的 nvcc 编译器检测阶段：
            # 检测不传 CMAKE_CUDA_FLAGS，CUDAFLAGS env 也只被 nvcc trace 打印
            # 不被消费。故把 #error 行首改成 // 注释——检测与正式编译读同一
            # 个文件，一并放行（#warning 不行：MSVC 19.5x 里它要 /std:c++23
            # preview 才合法，run #32 实测报 C1188）。若原 #error 是 \ 续行的
            # 多行文案，行拼接先于注释处理，续行会被一并并入注释，语法安全。
            # 风险等级与官方 flag 相同（use at your own risk），若编译期撞出
            # 真正的不兼容再评估升 CUDA 13.x。
            sed -i 's/^#error -- unsupported Microsoft Visual Studio version/\/\/ CI patched (CUDA 12.4 officially supports MSVC 2017-2022, relaxed for 2026 runner): -- unsupported Microsoft Visual Studio version/' \
              "$CUDA_PATH/include/crt/host_config.h"
            WIN_ARGS+=("-DCMAKE_CUDA_FLAGS=-Xcompiler=-utf-8 -allow-unsupported-compiler")
          fi
          # shellcheck disable=SC2086
          cmake -S .audiocpp-src -B .audiocpp-build "${WIN_ARGS[@]}" $COMMON_FLAGS $AUDIOCPP_EXTRA -DCMAKE_BUILD_TYPE=Release
          JOBS="${NUMBER_OF_PROCESSORS:-$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)}"
          cmake --build .audiocpp-build --target audiocpp_server --config Release --parallel "$JOBS"
          # 定位产物。Unix 真身名为 audiocpp_server（无后缀歧义，find 兜底跨生成器差异）；
          # Windows 禁用模糊 find：`audiocpp_server*` 会先命中 CMakeFiles/ 下的中间产物
          # （目录序 CMakeFiles < bin；Ninja+CUDA 实测拿到 12K 的 device-link obj，旧
          # VS 生成器则拿到 442B 的 Release/audiocpp_server.exp），而数百 MB 的真身在
          # bin/audiocpp_server.exe。v0.1.21~v0.1.23 的 Windows 安装包因此全装了残片，
          # 引擎启动报 os error 216（ERROR_EXE_MACHINE_TYPE_MISMATCH）。
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC_BIN=".audiocpp-build/bin/audiocpp_server.exe"
          else
            SRC_BIN=$(find .audiocpp-build -type f -name 'audiocpp_server' ! -name '*.dSYM*' | head -1)
          fi
          test -n "$SRC_BIN" || { echo '::error::audiocpp_server 产物未找到'; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            # 门禁：必须为 PE 且体积合理（裁剪构建实测约 12MB，CUDA 版数百 MB；
            # 残片仅 442B/12K，取 5MB 下限）。
            # MZ 头缺失时顺带打印构建树里全部同名产物，便于定位真身缺在哪里。
            [ "$(head -c 2 "$SRC_BIN" 2>/dev/null)" = "MZ" ] || {
              echo "::error::$SRC_BIN 不是 PE 可执行（MZ 头缺失）"
              find .audiocpp-build -name 'audiocpp_server*' -exec ls -la {} +
              exit 1
            }
            SIZE=$(wc -c < "$SRC_BIN")
            [ "$SIZE" -gt 5242880 ] || { echo "::error::$SRC_BIN 仅 ${SIZE} 字节（<5MB），残缺产物"; exit 1; }
          fi
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then EXE_SUFFIX=".exe"; else EXE_SUFFIX=""; fi
          cp "$SRC_BIN" "src-tauri/binaries/audiocpp_server-${AUDIOCPP_TRIPLE}${EXE_SUFFIX}"
          ls -lh src-tauri/binaries/

      - name: Collect CUDA runtime DLLs
        # CUDA 后端（ggml-cuda）由上游 CMake 强制 BUILD_SHARED_LIBS=OFF 静态
        # 编进 audiocpp_server.exe（release-0.6.1 实测产物为静态 .lib，不存在
        # ggml-cuda.dll），exe 运行时缺的只是 CUDA Toolkit 的动态运行时
        # （cudart/cuBLAS/cuFFT，按 major 版本 glob，不硬编码小版本）。收集到
        # src-tauri/resources/cuda/，经 tauri.windows.conf.json 的 resources
        # 随安装包落安装目录，运行时由子进程 PATH 前置
        # （server.rs::augmented_child_path）解析。
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/cuda
          # CUDA Toolkit 动态运行时（exe 的全部外部 CUDA 依赖；glob 不匹配时
          # cp 收到字面量报错退出，set -e 即中止）
          for prefix in cudart64_ cublas64_ cublasLt64_ cufft64_; do
            cp "$CUDA_PATH"/bin/"${prefix}"*.dll src-tauri/resources/cuda/
          done
          # 门禁：关键 DLL 必须在（缺失时引擎加载报 0xC0000135）
          ls src-tauri/resources/cuda/cudart64_*.dll >/dev/null || {
            echo '::error::cudart DLL 未收集到（CUDA_PATH 定位失败？）'; exit 1;
          }
          ls src-tauri/resources/cuda/cublas64_*.dll >/dev/null || {
            echo '::error::cuBLAS DLL 未收集到'; exit 1;
          }
          ls -lh src-tauri/resources/cuda/
          # 运行冒烟：引擎能起（DLL 集齐）。--help 若被引擎识别会即刻退出；
          # 若引擎直接开始服务则由 timeout 杀掉（退出码 124，同样算通过）。
          # DLL 缺失时进程死 0xC0000135（bash 呈现为 127）→ 门禁失败。
          set +e
          timeout 60 "src-tauri/binaries/audiocpp_server-x86_64-pc-windows-msvc.exe" --help >/dev/null 2>&1
          smoke=$?
          set -e
          # 门禁：只放行 0（--help 即退）与 124（服务模式被 timeout 杀掉），其余一律
          # 失败。126=无法执行（非 PE 残片——旧门禁只拦 127/0xC0000135，v0.1.21~
          # v0.1.23 的 12K/442B 残片全从 126 漏过）、127=命令未找到、
          # 3221225781(0xC0000135)=DLL 加载失败。
          if [ "$smoke" -ne 0 ] && [ "$smoke" -ne 124 ]; then
            echo "::error::引擎冒烟失败（exit=$smoke）"
            exit 1
          fi
          echo "smoke exit=$smoke（0/124 视为通过）"

      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          # macOS 关闭 action 上传、改为下方手动上传：dmg 需先经
          # scripts/patch-dmg-gatekeeper.sh 注入「首次打开修复.command」
          # （未签名应用被 Gatekeeper 报「已损坏」，双击脚本即自动安装 + 修复），
          # 注入必须发生在产物落盘之后、上传之前，action 的上传时机插不进自定义步骤。
          uploadWorkflowArtifacts: ${{ runner.os != 'macOS' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配置证书后由 tauri-action 自动签名/公证 macOS 产物
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Stage macOS bundles and inject Gatekeeper fixer
        # 产物先拷到 staged/ 扁平目录再上传：upload-artifact 以多行 path 的公共
        # 祖先为根保留目录结构，直接传 bundle/ 会带出 dmg/、macos/ 子目录，
        # release job 下载合并后 `for f in *` 就扫不到文件了。
        # 注意是仓库根 target/ 而非 src-tauri/target/：根 Cargo.toml 定义了
        # workspace，cargo 把产物统一放在 workspace 根 target/ 下按 triple 分目录。
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.triple }}/release/bundle"
          shopt -s nullglob
          DMGS=("$BUNDLE"/dmg/*.dmg)
          # 空 glob 防呆：路径写错/布局变化时立刻失败并打出目录树，而不是发布出
          # 一个没有 dmg 的 Release。只校验 dmg：本仓库未启用 updater，
          # 不产出 .app.tar.gz（已核实历史 Release 资产）。
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "::error::未找到 dmg 产物: $BUNDLE/dmg/"
            ls -R "$BUNDLE" || true
            exit 1
          fi
          mkdir -p staged
          cp "${DMGS[@]}" staged/
          for dmg in staged/*.dmg; do
            # tauri bundle_dmg 刚 detach 过同卷名（ZapMomo）镜像，diskarbitration
            # 释放有延迟，patch 脚本里的 hdiutil attach 偶发 Mount failed
            # （exit 16；run #34 x64 腿实测，与成功的 arm64 腿只差几秒）。
            # 脚本 set -e 即刻中止且 WORK 目录每次全新，外层等待后重试即可。
            for attempt in 1 2 3; do
              if ./scripts/patch-dmg-gatekeeper.sh "$dmg"; then
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "::error::dmg patch 三次均失败: $dmg"
                exit 1
              fi
              echo "::warning::dmg patch 第 ${attempt} 次失败（疑似卷释放竞态），10 秒后重试"
              sleep 10
            done
          done
          ls -l staged

      - name: Upload macOS bundles
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          # 双架构同为 macos-latest，platform 无法区分，按 triple 命名；
          # release job 的 download-artifact 用 pattern '*' 合并，名字只需唯一
          name: bundle-${{ matrix.triple }}
          path: staged/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Guard: only publish from v* tags"
        # 本 workflow 也可 workflow_dispatch 手动触发（验证构建用），但下方
        # softprops 会以 github.ref_name（分支名）为 tag 建公开 Release 并触发
        # upload-baidu-pan.yml，必须硬拦：仅 v* tag 允许走到发布。
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::release job 仅支持 v* tag 触发；workflow_dispatch 只用于验证构建，不发布。"
          exit 1

      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true

      - name: Rename installers to user-friendly asset names
        # Tauri 产物默认名对普通用户不友好：平台术语混杂
        # （x64-setup / aarch64 / amd64 / x86_64）；
        # Windows 双安装包、macOS 双架构无选择指引。统一重命名为
        # <产品>_<平台>_<架构>.<后缀>，Release 资产列表按平台自动分组排序。
        # 刻意不注入版本号：资产名跨版本保持不变，README 的
        # releases/latest/download/<文件名> 直链因此永远指向最新版，
        # 用户无需访问 Release 页即可一键下载。代价是下载到本地的文件名不含
        # 版本号（0.1.x 阶段可接受）；未来启用 Tauri updater 时需恢复版本化资产。
        # 未启用 updater（无 .sig 签名文件），重命名不影响任何校验。
        # 注意：aarch64.dmg 分支必须在 x64.dmg 之前（前者同样匹配 *x64.dmg）。
        shell: bash
        run: |
          shopt -s nullglob
          for f in *; do
            case "$f" in
              *x64-setup.exe)  mv "$f" "ZapMomo_Windows_x64.exe" ;;
              *_en-US.msi)     mv "$f" "ZapMomo_Windows_x64.msi" ;;
              *aarch64.dmg)    mv "$f" "ZapMomo_macOS_arm64.dmg" ;;
              *x64.dmg)        mv "$f" "ZapMomo_macOS_x64.dmg" ;;
              *amd64.deb)      mv "$f" "ZapMomo_Linux_amd64.deb" ;;
              *x86_64.rpm)     mv "$f" "ZapMomo_Linux_x86_64.rpm" ;;
              *amd64.AppImage) mv "$f" "ZapMomo_Linux_amd64.AppImage" ;;
            esac
          done
          ls -1

      - name: Generate release body (download guide)
        # 生成带「平台选择表格 + 下载按钮」的正文。资产名不含版本号（见上方
        # rename step），故链接用 <tag>/<固定文件名> 指向本次发布的具体资产。
        # generate_release_notes 的自动变更日志会追加在 body 之后（表格在上、changelog 在下）。
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > release_body.md <<EOF
          ## 📦 下载

          | 系统 | 芯片 / 架构 | 下载 | 说明 |
          | --- | --- | --- | --- |
          | **Windows 10 / 11** | x64 | [![Windows](https://img.shields.io/badge/download-Setup.exe-0078D6?logo=windows)](${BASE}/ZapMomo_Windows_x64.exe) | 双击安装；企业批量部署可选 [MSI 版](${BASE}/ZapMomo_Windows_x64.msi) |
          | **macOS 13+** | Apple Silicon（M1/M2/M3/M4） | [![macOS](https://img.shields.io/badge/download-arm64.dmg-8E8E93?logo=apple)](${BASE}/ZapMomo_macOS_arm64.dmg) | 不确定芯片？见下方说明 |
          | **macOS 13+** | Intel | [![macOS](https://img.shields.io/badge/download-x64.dmg-8E8E93?logo=apple)](${BASE}/ZapMomo_macOS_x64.dmg) | — |
          | **Ubuntu / Debian** | amd64 | [![deb](https://img.shields.io/badge/download-amd64.deb-A80030?logo=debian&logoColor=white)](${BASE}/ZapMomo_Linux_amd64.deb) | 或 [AppImage](${BASE}/ZapMomo_Linux_amd64.AppImage) 免安装运行 |
          | **Fedora / RHEL** | x86_64 | [![rpm](https://img.shields.io/badge/download-x86_64.rpm-294172?logo=fedora&logoColor=white)](${BASE}/ZapMomo_Linux_x86_64.rpm) | 或 [AppImage](${BASE}/ZapMomo_Linux_amd64.AppImage) 免安装运行 |

          > 🍎 **Mac 用户看这里：**
          > 1. 不确定选哪个？点按左上角  菜单 →「关于本机」：显示「芯片：Apple M…」下载 **arm64** 版；显示「处理器：Intel Core…」下载 **x64** 版。
          > 2. 首次打开若提示「"ZapMomo" 已损坏，无法打开」，并非真的损坏（应用未做 Apple 签名公证，被 Gatekeeper 拦截）：**双击 dmg 窗口里的「首次打开修复.command」**，自动安装到「应用程序」、清除隔离属性并启动；也可手动执行终端命令 \`xattr -cr /Applications/ZapMomo.app\`。详见 README「macOS 首次打开」一节。
          EOF
          cat release_body.md

      - name: Check release token
        # 发布前确认 PAT_TOKEN 可用，缺失/过期时在这里报清晰错误，避免发布 job
        # 跑到最后一步才失败（见文件头注释，为何不能用 GITHUB_TOKEN）。该 Secret
        # 与 publish.yml 的 release-plz 共用，正常不会缺失；报错多半意味着 PAT
        # 已过期——需换新后同步更新 Secret，否则 release-plz 同样会失败。
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::缺少 PAT_TOKEN Secret（publish.yml 的 release-plz 也在使用，正常不应缺失，请检查是否被误删）。"
            exit 1
          fi

      - name: Attach installers to draft release
        uses: softprops/action-gh-release@v3
        with:
          # 显式传 PAT：用 GITHUB_TOKEN 发布的 release 事件不会触发
          # upload-baidu-pan.yml（GitHub 防递归机制，事件被静默丢弃）
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_body.md
          generate_release_notes: true
          files: |
            *.dmg
            *.app.tar.gz
            *.deb
            *.rpm
            *.AppImage
            *.msi
            *.exe
